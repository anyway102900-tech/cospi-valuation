name: Daily ECOS News Sentiment Update

on:
  schedule:
    - cron: '0 0 * * *' # 매일 한국 시간 오전 9시 (00:00 UTC)
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run ECOS data collection
        run: python update_data.py
        
      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: 한국은행 ECOS 최신 뉴스심리지수 갱신 [skip ci]" && git push)
