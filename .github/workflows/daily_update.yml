name: Daily Data Auto-Update

on:
  schedule:
    # 1차 실행: 평일 한국 시간 16:40 (07:40 UTC, 정각/30분 트래픽 몰림 회피)
    - cron: '40 7 * * 1-5'
    # 2차 보조 실행: 평일 한국 시간 17:15 (08:15 UTC, 지연 방지용 이중 안전망)
    - cron: '15 8 * * 1-5'
  workflow_dispatch: # 필요 시 GitHub 웹에서 버튼 클릭으로 즉시 실행 가능

permissions:
  contents: write # 레포지토리에 git push 권한 부여

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 데이터 업데이트 스크립트 실행
        run: |
          python update_data.py

      - name: 변경된 데이터 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: 자동 일일 시세 및 지표 업데이트 [skip ci]" && git pull --rebase origin main && git push origin main)
